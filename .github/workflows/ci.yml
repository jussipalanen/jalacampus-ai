name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Disposable CI-only database for integration tests; the password is not a secret.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: jalacampus_test
          POSTGRES_USER: jalacampus
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jalacampus -d jalacampus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql://jalacampus:ci-only-password@localhost:5432/jalacampus_test
          REQUIRE_DATABASE_TESTS: '1'
        run: npm test
      - name: Build
        run: npm run build
