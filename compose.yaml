services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jalacampus
      POSTGRES_USER: jalacampus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jalacampus -d jalacampus"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
