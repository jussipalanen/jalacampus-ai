services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jalacampus
      POSTGRES_USER: jalacampus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jalacampus -d jalacampus"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Next.js dev server with hot reload. Development only; Vercel builds production.
  web:
    build: docker/web
    command: sh docker/web/start.sh
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # Inside Docker the database is reached by its service name, not localhost.
      DATABASE_URL: postgresql://jalacampus:${POSTGRES_PASSWORD}@db:5432/jalacampus
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  web_node_modules:
  web_next:
